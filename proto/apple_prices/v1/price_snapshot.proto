syntax = "proto3";

package apple_prices.v1;

// One weekly snapshot of what Apple charges in each of its own online stores.
message PriceSnapshot {
  int64 fetched_at_unix_seconds = 1;
  repeated Product products = 2;
  repeated AppleStore apple_stores = 3;
  repeated SalesTaxRegion sales_tax_regions = 4;
  ExchangeRates exchange_rates = 5;
  repeated RecyclingFee recycling_fees = 6;
}

enum ProductCategory {
  PRODUCT_CATEGORY_UNSPECIFIED = 0;
  PRODUCT_CATEGORY_IPHONE = 1;
  PRODUCT_CATEGORY_IPAD = 2;
  PRODUCT_CATEGORY_MAC = 3;
  PRODUCT_CATEGORY_DISPLAY = 4;
  PRODUCT_CATEGORY_WATCH = 5;
  PRODUCT_CATEGORY_VISION = 6;
  PRODUCT_CATEGORY_AIRPODS = 7;
  PRODUCT_CATEGORY_HOME = 8;
  PRODUCT_CATEGORY_ACCESSORY = 9;
}

message Product {
  string product_id = 1;
  string product_name = 2;
  ProductCategory category = 3;
  // Apple's image server address for the product photo, without size options; add e.g. ?wid=800&hei=800&fmt=png-alpha.
  string apple_image_url = 4;
  // The base model comes first.
  repeated ProductConfiguration configurations = 5;
}

message ProductConfiguration {
  string configuration_id = 1;
  ProductSpecs specs = 2;
}

// Only the specs that tell one standard configuration from another, plus the chip.
message ProductSpecs {
  string chip = 1;
  optional int32 cpu_core_count = 2;
  optional int32 gpu_core_count = 3;
  optional int32 memory_gigabytes = 4;
  // Decimal, as Apple counts: 1TB is 1000.
  optional int32 storage_gigabytes = 5;
  optional double screen_size_inches = 6;
  string connectivity = 7;
  string display_glass = 8;
  string stand = 9;
  string case_material = 10;
  optional int32 case_size_millimetres = 11;
  optional int32 pack_quantity = 12;
  string charging_case = 13;
}

enum PriceSourceKind {
  PRICE_SOURCE_KIND_UNSPECIFIED = 0;
  PRICE_SOURCE_KIND_APPLE_ONLINE_STORE = 1;
  // Apple's own product pages, where Apple has no online store; base models only.
  PRICE_SOURCE_KIND_APPLE_PRODUCT_PAGE = 2;
}

message AppleStore {
  string apple_store_id = 1;
  // ISO 3166-1 alpha-2.
  string country_code = 2;
  string currency_code = 3;
  string store_url = 4;
  PriceSourceKind price_source_kind = 5;
  bool shelf_price_includes_sales_tax = 6;
  repeated ShelfPrice shelf_prices = 7;
  // Products Apple's store confirms it doesn't sell here. A product in neither list has no price from Apple here.
  repeated string product_ids_not_sold = 8;
  // The consumption tax in this store's shelf price, which a price before tax takes out. Unset where the store adds tax at checkout.
  ConsumptionTax consumption_tax = 9;
}

// One country's standard VAT, GST or consumption tax, as checked against a first-party source.
message ConsumptionTax {
  // Unset where no single rate can be taken out of the shelf price, for the reason given.
  optional double percent = 1;
  // As the country calls it: VAT, GST, consumption tax.
  string tax_name = 2;
  string why_no_single_rate = 3;
  string source_name = 4;
  string source_url = 5;
  // ISO 8601 date the rate was last checked as current.
  string checked_on = 6;
  // Where the taxes depend on the kind of product, the first entry naming the product's id or category replaces the single rate.
  repeated ProductTaxes product_taxes = 7;
}

// Every tax on the sale of one kind of product, in the order they are charged. Import duties are not taxes on the sale and stay in.
message ProductTaxes {
  repeated ProductCategory categories = 1;
  repeated string product_ids = 2;
  repeated TaxOnSale taxes = 3;
  // Set, with no taxes, where a tax on this kind of product could not be confirmed.
  string why_not_known = 4;
  string source_name = 5;
  string source_url = 6;
}

message TaxOnSale {
  // As a visitor would read it: VAT, special consumption tax, TRT fee.
  string name = 1;
  double percent = 2;
  TaxBase base = 3;
}

enum TaxBase {
  TAX_BASE_UNSPECIFIED = 0;
  // Charged on the price so far and added to it, like VAT.
  TAX_BASE_ADDED = 1;
  // A share of the final price, like Brazil's state sales tax.
  TAX_BASE_SHARE_OF_PRICE = 2;
  // A share of the price less the other taxes in it, like Brazil's PIS and COFINS.
  TAX_BASE_SHARE_OF_REVENUE = 3;
}

message ShelfPrice {
  string product_id = 1;
  string configuration_id = 2;
  // Price times 100, in the store's currency.
  int64 price_in_hundredths = 3;
  string source_page_url = 4;
  // One of Apple's part numbers for this configuration in this store.
  string apple_part_number = 5;
}

message SalesTaxRegion {
  // ISO 3166-2, for example US-OR or CA-QC.
  string region_code = 1;
  string region_name = 2;
  string apple_store_id = 3;
  double sales_tax_percent = 4;
  string sales_tax_method = 5;
  string source_name = 6;
  string source_url = 7;
  string rates_effective_date = 8;
}

// A fee Apple adds at checkout in one region, on top of the shelf price and not taxed, such as California's electronics recycling fee.
message RecyclingFee {
  string region_code = 1;
  string fee_name = 2;
  string source_url = 3;
  repeated RecyclingFeeAmount amounts = 4;
}

message RecyclingFeeAmount {
  string product_id = 1;
  string configuration_id = 2;
  int64 fee_in_hundredths = 3;
}

message ExchangeRates {
  string source_name = 1;
  string source_url = 2;
  int64 published_at_unix_seconds = 3;
  repeated CurrencyRate rates = 4;
}

message CurrencyRate {
  string currency_code = 1;
  double units_per_us_dollar = 2;
}
